name: Validate Linux Tests
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install numpy
    - name: Create and Run Non-Interactive Test
      run: |
        echo "import numpy as np; print('NumPy Version:', np.__version__)" > run_test.py
        python run_test.py
