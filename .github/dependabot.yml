version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/ccache
    schedule:
      interval: weekly
    cooldown:
      default-days: 7     # optional
    commit-message:
      prefix: "MAINT"
    labels:
      - "03 - Maintenance"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "bus1/cabuild"
