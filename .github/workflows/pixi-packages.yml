name: Pixi packages tests

on:
  pull_request:
    branches:
      - main
      - maintenance/**
    paths-ignore:
      - '**.pyi'
      - '**.md'
      - '**.rst'

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_packages:
    name: Build Pixi packages
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-24.04-arm]
        package_variant:
          - default
          - freethreading
          - asan
          # TSan CI runs for longer than 30 minutes due to slow
          # stdlib bytecode compilation step. Disable or parallelize
          # byte compilation once rattler-build has support.
          # See https://github.com/prefix-dev/pixi/pull/5737
          # - tsan-freethreading
        include:
          # Keep one macOS packaging check; Linux covers all package variants.
          - runs-on: macos-latest
            package_variant: default
    if: github.repository == 'numpy/numpy'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-tags: true
        persist-credentials: false

    - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: v0.83.0
        run-install: false

    - name: Build
      run: pixi publish --path="pixi-packages/${{ matrix.package_variant }}"
