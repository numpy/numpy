name: stubtest
permissions: read-all

# Stubtest depends on different branches and paths than mypy does, so we have a separate workflow.

on:
  pull_request:
    branches:
      - "main"
      - "maintenance/2.**"
      # Stubtest requires numpy>=2.4
      - "!maintenance/2.[0-3].x"
    paths:
      - ".github/workflows/stubtest.yml"
      - "numpy/**"
      - "!numpy/**/tests/**"
      - "**/pyproject.toml"
      - "tools/stubtest/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mypy:
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'numpy/numpy'

    name: stubtest
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO: consider including macos and windows
        os: [ubuntu]
        py: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-tags: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.py }}
          activate-environment: true
          cache-dependency-glob: |
            **/pyproject.toml

      - name: uv pip install
        run: >-
          uv pip install --group dev-cli --group typing

      - name: spin build
        run: spin build -j2 -- -Dallow-noblas=true -Ddisable-optimization=true --vsenv

      - name: spin stubtest
        run: spin stubtest
