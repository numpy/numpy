name: macOS tests

on:
  pull_request:
    branches:
      - main
      - maintenance/**
    paths-ignore:
      - '**.pyi'
      - '**.md'
      - '**.rst'
      - 'tools/stubtest/**'

permissions:
   contents: read  # to fetch code (actions/checkout)

env:
  CCACHE_DIR: "${{ github.workspace }}/.ccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  aarch64_pixi:
    name: macOS aarch64, OpenBLAS, full, pixi
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'numpy/numpy'
    runs-on: macos-26

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-tags: true
        persist-credentials: false

    - name:  Prepare cache dirs and timestamps
      id:    prep-ccache
      run: |
        mkdir -p "${CCACHE_DIR}"
        echo "dir=$CCACHE_DIR" >> $GITHUB_OUTPUT
        NOW=$(date -u +"%F-%T")
        echo "timestamp=${NOW}" >> $GITHUB_OUTPUT

    - name: Setup compiler cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id:    cache-ccache
      with:
        path: ${{ steps.prep-ccache.outputs.dir }}
        key:  ${{ github.workflow }}-${{ github.job }}-ccache-macos-${{ steps.prep-ccache.outputs.timestamp }}
        restore-keys: |
          ${{ github.workflow }}-${{ github.job }}-ccache-macos-

    # Compilers and OpenBLAS come from Pixi; its activation sets CC="ccache clang".
    - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
      with:
        pixi-version: v0.83.0
        cache: false

    - name: Build NumPy
      run: pixi run --locked build

    - name: Run test suite (full)
      env:
        OMP_NUM_THREADS: 2
        PYTEST_ADDOPTS: "--durations=10"
      run: pixi run --locked --skip-deps test-full -j2

    - name: Meson log
      if: failure()
      run: cat build/meson-logs/meson-log.txt

    - name: Ccache statistics
      run: pixi run --locked -e build ccache -s


  accelerate:
    name: Accelerate - ${{ matrix.build_runner[1] }} - ${{ matrix.version }}
    # To enable this workflow on a fork, comment out:
    if: github.repository == 'numpy/numpy'
    runs-on: ${{ matrix.build_runner[0] }}
    strategy:
      fail-fast: false
      matrix:
        build_runner:
          - [ macos-15-intel, "macos_x86_64" ]
          - [ macos-15, "macos_arm64" ]
        version: ["3.12", "3.15t"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-tags: true
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.version }}

    - name: Install dependencies
      run: |
        pip install --group dev-cli --group test

    - name: Build against Accelerate (LP64)
      run: spin build -- -Ddisable-optimization=true -Dallow-noblas=false

    - name: Test (linalg only)
      run: spin test -j2 -- numpy/linalg --timeout=600 --durations=10

    - name: Build NumPy against Accelerate (ILP64)
      run: |
        rm -r build build-install
        spin build -- -Duse-ilp64=true -Ddisable-optimization=true -Dallow-noblas=false

    - name: Test (fast tests)
      if: ${{ matrix.version != '3.14t' || matrix.build_runner[0] != 'macos-15' }}
      run: spin test -j2 -- --timeout=600 --durations=10

    - name: Test in multiple threads
      if: ${{ matrix.version == '3.14t' && matrix.build_runner[0] == 'macos-15' }}
      run:  |
        pip install pytest-run-parallel==0.8.2
        spin test -p 4 -- -sv --timeout=600 --durations=10
