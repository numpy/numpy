name: MesonBuildTest
description: "checkout repo, build, and test numpy"
runs:
  using: composite
  steps:
  - name: Install safe pip
    shell: bash
    run: |
      python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

  - name: Build
    shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'
    env:
      TERM: xterm-256color
      PKG_CONFIG_PATH: ./.openblas
    run: |
      echo "::group::Installing Build Dependencies"
      pip install --group dev-cli
      echo "::endgroup::"
      echo "::group::Building NumPy"
      spin build --clean -- ${MESON_ARGS[@]}
      echo "::endgroup::"

  - name: Meson Log
    shell: bash
    if: always()
    run: |
      echo "::group::Meson Log"
      cat build/meson-logs/meson-log.txt
      echo "::endgroup::"

  - name: Test
    shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'
    env:
      TERM: xterm-256color
    run: |
      echo "::group::Installing Test Dependencies"
      python -m pip install --group test-extending
      echo "::endgroup::"
      echo "::group::Test NumPy"
      spin test -- --durations=10 --timeout=600
      echo "::endgroup::"
